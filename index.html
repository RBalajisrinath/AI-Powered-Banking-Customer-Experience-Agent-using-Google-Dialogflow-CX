<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SecureBank Assistant — Live Demo</title>
  <script defer
    src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js">
  </script>
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css" />
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css" />
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      color: #0a2540;
    }
    header {
      background: #0a2540;
      color: #fff;
      padding: 1rem 1.5rem;
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 0.35rem 0 0; opacity: 0.85; font-size: 0.9rem; }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .hint {
      background: #fff;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    chat-messenger {
      display: block;
      min-height: 520px;
    }
  </style>
</head>
<body>
  <header>
    <h1>SecureBank Assistant</h1>
    <p>Live chat + voice — click the mic in the widget to speak</p>
  </header>
  <main>
    <p class="hint">
      Use the chat widget below — type or use the <strong>microphone</strong>. Try: <strong>hi</strong>,
      <strong>apply for debit card</strong>, <strong>start application</strong>, <strong>main menu</strong>,
      upload a bill or voice note, or <strong>talk to a manager</strong>.
    </p>

    <script>
      window.addEventListener("chat-messenger-loaded", () => {
        chatSdk.registerContext(
          chatSdk.prebuilts.ces.createContext({
            deploymentName: "projects/483022708683/locations/us/apps/b1706033-3e76-46d8-acb8-17133fe2ca65/deployments/ec999ff4-4faa-4a20-98d8-3b7c87806236",
            tokenBroker: {
              enableTokenBroker: true,
              enableRecaptcha: false
            }
          }),
        );
      });
    </script>

    <chat-messenger url-allowlist="*">
      <chat-messenger-container
        chat-title="SecureBank AI"
        chat-title-icon="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png"
        enable-file-upload
        enable-audio-input
      >
        <chat-reset-session-button
          slot="titlebar-actions"
          title-text="Start new chat"
        ></chat-reset-session-button>
        <chat-toggle-dialog-button
          slot="titlebar-actions"
          title-text-expanded="Collapse"
          title-text-collapsed="Expand"
        ></chat-toggle-dialog-button>
        <chat-messenger-close-button
          slot="titlebar-actions"
          title-text="Close"
        ></chat-messenger-close-button>
      </chat-messenger-container>
    </chat-messenger>
  </main>
</body>
</html>
